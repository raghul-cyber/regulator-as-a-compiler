name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Install dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
          
      - name: Run Tests
        working-directory: apps/api
        env:
          DATABASE_URL: "postgresql+asyncpg://dummy:dummy@localhost/dummy"
          REDIS_URL: "redis://localhost:6379/0"
          CLERK_SECRET_KEY: "dummy_clerk_secret_key"
          CLERK_PUBLISHABLE_KEY: "dummy_clerk_publishable_key"
          CLERK_WEBHOOK_SECRET: "dummy_clerk_webhook_secret"
          OPENAI_API_KEY: "dummy_openai_api_key"
          S3_BUCKET: "dummy_s3_bucket"
          S3_ACCESS_KEY: "dummy_s3_access_key"
          S3_SECRET_KEY: "dummy_s3_secret_key"
        run: |
          PYTHONPATH=. pytest tests/test_extraction_quality.py -v

