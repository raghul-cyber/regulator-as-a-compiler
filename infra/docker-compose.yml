version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: rac-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: rac_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: rac-redis
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    container_name: rac-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:password@db:5432/rac_db
      - REDIS_URL=redis://redis:6379/0
      # Provide dummy values or load from .env for others
    env_file:
      - ../apps/api/.env
    depends_on:
      - db
      - redis
    volumes:
      - ./apps/api:/app

  worker:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    container_name: rac-worker
    command: celery -A app.worker.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:password@db:5432/rac_db
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - ../apps/api/.env
    depends_on:
      - db
      - redis
      - api
    volumes:
      - ./apps/api:/app

volumes:
  postgres_data:
